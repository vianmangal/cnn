version: "3.9"

services:
  db:
    image: postgres:16
    container_name: emotiondb
    environment:
      POSTGRES_DB: emotiondb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - emotiondb_data:/var/lib/postgresql/data

volumes:
  emotiondb_data:
